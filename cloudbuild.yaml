# Cloud Build + Cloud Run deployment for NYC Transit Hub
#
# Prerequisites:
#   gcloud auth login
#   gcloud config set project YOUR_PROJECT_ID
#   gcloud services enable run.googleapis.com cloudbuild.googleapis.com secretmanager.googleapis.com
#
# One-time secrets setup:
#   echo -n "YOUR_GEMINI_KEY"    | gcloud secrets create gemini-api-key --data-file=-
#   echo -n "YOUR_SECRET_KEY"    | gcloud secrets create flask-secret-key --data-file=-
#   echo -n "YOUR_DATABASE_URL"  | gcloud secrets create db-url --data-file=-
#
# Deploy:
#   gcloud builds submit --config cloudbuild.yaml .

substitutions:
  _REGION: us-central1
  _SERVICE: nyc-transit-hub

steps:
  # 1. Build the container image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/nyc-transit-hub:latest
      - .

  # 2. Push to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - gcr.io/$PROJECT_ID/nyc-transit-hub:latest

  # 3. Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE
      - --image=gcr.io/$PROJECT_ID/nyc-transit-hub:latest
      - --region=$_REGION
      - --platform=managed
      - --allow-unauthenticated
      - --port=5001
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --set-secrets=GEMINI_API_KEY=gemini-api-key:latest,SECRET_KEY=flask-secret-key:latest,DB_URL=db-url:latest
      - --set-env-vars=POLL_INTERVAL=30,CORS_ORIGIN=*

images:
  - gcr.io/$PROJECT_ID/nyc-transit-hub:latest

options:
  logging: CLOUD_LOGGING_ONLY
